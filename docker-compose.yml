# Beo OS — React (Nginx) + API (Fastify)
# xCloud Environment: VITE_SUPABASE_* (frontend build) + SUPABASE_* / ADMIN_EMAILS (API)

services:
  beo-os-api:
    container_name: beo-os-api
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8787
      CORS_ORIGINS: ${CORS_ORIGINS:-https://whispering-cliff.1wp.site}
      SUPABASE_URL: ${SUPABASE_URL:-${VITE_SUPABASE_URL:-}}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-${VITE_SUPABASE_ANON_KEY:-}}
      SYNC_FROM_DATE: ${SYNC_FROM_DATE:-2026-03-01}
      SYNC_OVERLAP_DAYS: ${SYNC_OVERLAP_DAYS:-7}
      MORNING_ENV: ${MORNING_ENV:-production}
      MORNING_KEY_ID: ${MORNING_KEY_ID:-}
      MORNING_KEY_SECRET: ${MORNING_KEY_SECRET:-}
      BOT_API_KEY: ${BOT_API_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      FINANCE_DOCS_DIR: /data/finance-documents
      MORNING_DATA_DIR: /data/morning
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - beo-os-finance-docs:/data/finance-documents
      - beo-os-morning:/data/morning
    restart: unless-stopped

  beo-os-web:
    container_name: beo-os-web
    depends_on:
      - beo-os-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_GREEN_INVOICE_URL: ${VITE_GREEN_INVOICE_URL:-}
    ports:
      - "127.0.0.1:3002:80"
    restart: unless-stopped

volumes:
  beo-os-finance-docs:
  beo-os-morning:
