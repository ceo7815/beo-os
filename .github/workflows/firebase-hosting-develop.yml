# פריסה לסביבת פיתוח — ענף develop בלבד (לא מחליף את האתר הראשי live)
name: Deploy to Firebase Hosting (develop)
on:
  push:
    branches:
      - develop
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HUB_POS_F399C }}
          channelId: development
          projectId: hub-pos-f399c
